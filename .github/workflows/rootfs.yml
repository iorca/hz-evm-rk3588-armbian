name: Rootfs cache (HZ-EVM-RK3588)

# Produces the Armbian rootfs tarball on its own and parks it in a Release.
# The image workflow downloads it before building, which skips the 20-40 minute
# rootfs stage entirely.
#
# Why this works at all: the rootfs cache name is
#   rootfs-<ARCH>-<RELEASE>-<cache_type>_<yyyymm>-<AGGREGATED_ROOTFS_HASH>-H<hooks>-B<bash>
# and it contains no board name, so the tarball is generic across every
# arm64 / <release> / <cache_type> board. Reuse only requires that id to match.
#
# What invalidates it (hence the pinned commit + the monthly cron below):
#   - yyyymm          -> rolls over every month
#   - AGGREGATED...   -> upstream changes the aggregated package list
#   - B<bash>         -> a hash of lib/functions/rootfs/{create-cache,rootfs-create}.sh
#   - cache_type      -> 'cli' vs 'minimal' vs desktop are different names
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Userspace release (noble / bookworm / trixie)"
        required: false
        default: "noble"
      minimal:
        description: "true = minimal CLI rootfs. Its cache name differs from the full CLI one."
        type: boolean
        required: false
        default: false
  schedule:
    # The cache name embeds `date +%Y%m`, so a tarball built in September can
    # never be reused in October. Refresh on the 1st of each month.
    - cron: '17 3 1 * *'

env:
  # Pinned deliberately: keeps the B<hash> and the aggregated package-list hash
  # stable, so the cache published here stays valid for the image build.
  # Bumping this SHA means you MUST re-run this workflow.
  ARMBIAN_BUILD_SHA: 04108a20e5de1c956425b3f5a2a7cba47ba829b8
  BOARD: hz-evm-rk3588
  ROOTFS_TAG: armbian-rootfs-cache

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout board overlay
        uses: actions/checkout@v4

      - name: Checkout Armbian build framework (pinned)
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: ${{ env.ARMBIAN_BUILD_SHA }}
          path: armbian-build
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                       /usr/local/lib/android /usr/share/swift 2>/dev/null || true
          sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox \
                       google* dotnet* powershell openjdk* moby* || true
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          df -h

      - name: Inject board overlay
        run: |
          # config/ and patch/ overlay on top of the pinned armbian/build tree.
          cp -r config armbian-build/
          cp -r patch armbian-build/

      - name: Build rootfs artifact
        working-directory: armbian-build
        run: |
          # The `rootfs` CLI subcommand builds (or fetches) just the rootfs
          # artifact and stops. The old ROOT_FS_CREATE_ONLY=yes variable is
          # deprecated and now errors out pointing at this subcommand.
          # sudo is required: debootstrap + chroot + qemu binfmt.
          sudo -E ./compile.sh rootfs \
            BOARD=${{ env.BOARD }} \
            BRANCH=current \
            RELEASE=${{ github.event.inputs.release || 'noble' }} \
            KERNEL_CONFIGURE=no \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=${{ github.event.inputs.minimal == 'true' && 'yes' || 'no' }} \
            EXPERT=yes

      - name: Collect rootfs tarball
        id: collect
        run: |
          ls -lh armbian-build/cache/rootfs/ || true
          files=$(ls armbian-build/cache/rootfs/*.tar.zst 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::No rootfs tarball was produced."
            ls -lhR armbian-build/cache/ || true
            exit 1
          fi
          # Print the cache id explicitly: this is the exact name the image
          # build has to compute for itself in order to hit the cache.
          for f in $files; do
            echo "rootfs cache file: $(basename "$f")  bytes=$(stat -c%s "$f")"
          done

      - name: Publish rootfs cache to release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.ROOTFS_TAG }}
          name: "Armbian rootfs cache (armbian/build @ ${{ env.ARMBIAN_BUILD_SHA }})"
          body: |
            Prebuilt Armbian rootfs tarball. The image workflow downloads this
            before building, which skips the 20-40 minute rootfs stage.

            - armbian/build pinned to `${{ env.ARMBIAN_BUILD_SHA }}`
            - board `${{ env.BOARD }}`, branch `current`
            - release `${{ github.event.inputs.release || 'noble' }}`
            - minimal `${{ github.event.inputs.minimal || 'false' }}`

            The file name embeds the rootfs cache id. The image build reuses it
            only when that id matches what it computes for its own
            configuration; otherwise it silently falls back to building the
            rootfs itself. Because the id also embeds the current year+month,
            this asset is refreshed on the 1st of every month.
          files: |
            armbian-build/cache/rootfs/*.tar.zst
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: false
          draft: false
