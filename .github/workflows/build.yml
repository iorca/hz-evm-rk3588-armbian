name: Build Armbian (HZ-EVM-RK3588)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Userspace release (noble / bookworm / trixie)"
        required: false
        default: "noble"
      branch:
        description: "Kernel branch (current / vendor)"
        required: false
        default: "current"
      minimal:
        description: "Build minimal CLI image (false = full image, published as .img.xz release asset)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "config/**"
      - "patch/**"
      - ".github/workflows/**"

env:
  # Pinned on purpose. The rootfs cache name embeds a hash of armbian/build's
  # lib/functions/rootfs/{create-cache,rootfs-create}.sh plus the aggregated
  # package-list hash; pinning keeps those stable so the rootfs tarball
  # published by the rootfs repo stays reusable here.
  # Must match Armbian-rootfs-dev's pin, or the cache ids will not line up.
  ARMBIAN_BUILD_SHA: 04108a20e5de1c956425b3f5a2a7cba47ba829b8
  # The rootfs is a board-independent arm64/noble/cli artifact, so it is built
  # and published from its own repo rather than from here.
  ROOTFS_REPO: iorca/Armbian-rootfs-dev
  ROOTFS_TAG: armbian-rootfs-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout board overlay
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                       /usr/local/lib/android /usr/share/swift 2>/dev/null || true
          sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox \
                       google* dotnet* powershell openjdk* moby* || true
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          df -h

      - name: Checkout Armbian build framework (pinned)
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: ${{ env.ARMBIAN_BUILD_SHA }}
          path: armbian-build
          fetch-depth: 1

      - name: Inject board files into the tree
        run: |
          # Our config/ and patch/ overlay on top of armbian/build.
          cp -r config armbian-build/
          cp -r patch armbian-build/

      - name: Fetch prebuilt rootfs cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p armbian-build/cache/rootfs
          # The rootfs artifact name is
          #   rootfs-<ARCH>-<RELEASE>-<cache_type>_<yyyymm>-<hashes>.tar.zst
          # and embeds no board name, so the tarball published by
          # Armbian-rootfs-dev is reusable here verbatim. Note --repo: the asset
          # lives in that repo, not in this one.
          #
          # If the id no longer matches what this build computes (month
          # rollover, upstream package-list change, ARMBIAN_BUILD_SHA bump) the
          # file just sits unused and Armbian rebuilds the rootfs - slower, but
          # never wrong.
          if gh release download "${ROOTFS_TAG}" \
               --repo "${ROOTFS_REPO}" \
               --pattern '*.tar.zst' \
               --dir armbian-build/cache/rootfs \
               --clobber; then
            echo "--- rootfs cache applied ---"
            ls -lh armbian-build/cache/rootfs/
          else
            echo "no rootfs cache release yet - Armbian will build the rootfs from scratch"
          fi

      - name: Verify injected overlay
        run: |
          echo "--- armbian/build revision (must equal the pinned SHA) ---"
          git -C armbian-build rev-parse HEAD
          echo "--- rootfs cache (prebuilt, if the id matched) ---"
          ls -lh armbian-build/cache/rootfs/ 2>/dev/null || echo "(empty - rootfs will be built from scratch)"
          echo "--- board conf ---"
          ls -l armbian-build/config/boards/hz-evm-rk3588.conf || true
          echo "--- kernel dt ---"
          find armbian-build/patch/kernel -type f || true
          echo "--- u-boot overlay ---"
          find armbian-build/patch/u-boot -type f || true
          echo "--- bootenv ---"
          cat armbian-build/config/bootenv/rk35xx.txt || true

      - name: Build image
        working-directory: armbian-build
        run: |
          # Armbian's compile.sh MUST run as root: it registers qemu binfmt handlers,
          # sets up loop devices, mounts and chroots into the target rootfs.
          # Running it as the unprivileged `runner` user aborts early (binfmt/chroot).
          sudo -E ./compile.sh \
            BOARD=hz-evm-rk3588 \
            BRANCH=${{ github.event.inputs.branch || 'current' }} \
            RELEASE=${{ github.event.inputs.release || 'noble' }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=${{ github.event.inputs.minimal == 'true' && 'yes' || 'no' }} \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            COMPRESS_OUTPUTIMAGE="sha,xz"

      - name: Collect build artifacts
        id: collect
        run: |
          ls -lh armbian-build/output/images/ || true
          # softprops/action-gh-release does not expand globs for us in all
          # cases; build the file list explicitly and fail loudly if empty.
          files=$(ls armbian-build/output/images/*.img.xz 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::No .img.xz produced - the build did not complete."
            ls -lhR armbian-build/output/ || true
            exit 1
          fi
          echo "found: $files"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: armbian-${{ github.run_number }}.${{ github.run_attempt }}
          name: Armbian HZ-EVM-RK3588 (${{ github.run_number }})
          body: |
            Armbian image for HZ-EVM-RK3588 (Rockchip RK3588), branch `${{ github.event.inputs.branch || 'current' }}`,
            release `${{ github.event.inputs.release || 'noble' }}`, minimal `${{ github.event.inputs.minimal || 'false' }}`.

            Flash the `.img.xz` to an SD card with balenaEtcher / `armbian-install`, or write it
            to eMMC via the vendor loader.
          files: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/*.img.txt
          fail_on_unmatched_files: true
          prerelease: false
          draft: false
