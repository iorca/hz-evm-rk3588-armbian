# Rockchip RK3588 octa core 2-32GB SoC 2xGbE USB3 PCIe HDMI CAN
# HZ-EVM-RK3588 (合众恒跃) - Armbian board config
BOARD_NAME="HZ-EVM-RK3588"
BOARD_VENDOR="hezuo"
BOARDFAMILY="rockchip-rk3588"
BOARD_MAINTAINER="orca"
INTRODUCED="2026"
BOOTCONFIG="hz-evm-rk3588_defconfig"
KERNEL_TARGET="current,vendor"
KERNEL_TEST_TARGET="current,vendor"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3588-hz-evm-rk3588.dtb"
BOOT_SCENARIO="spl-blobs"
BOOTFS_TYPE=fat
BOOTSIZE=256
IMAGE_PARTITION_TABLE="gpt"
PACKAGE_LIST_BOARD="i2c-tools can-utils"

# ==================== uboot config ====================
# current/edge: mainline U-Boot v2026.07 + rkbin BL31/DDR blobs
# vendor: Radxa vendor U-Boot + BSP kernel (family default)
function post_family_config__hz_evm_use_mainline_uboot_except_vendor() {
	if [[ "${BRANCH}" == "vendor" ]]; then
		display_alert "$BOARD" "Vendor: using vendor U-Boot + kernel" "info"
		return 0
	fi

	display_alert "$BOARD" "Mainline (${BRANCH}): using mainline U-Boot v2026.07" "info"
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot"
	declare -g BOOTBRANCH="tag:v2026.07"
	declare -g BOOTPATCHDIR="v2026.07"
	declare -g BOOTDIR="u-boot-${BOARD}"
	# 主线内核(torvalds)不带我们的板级 dts，必须自建 patch 目录注入
	declare -g KERNELPATCHDIR="rk35xx-current"
	# 本板走双千兆网口，不需要附加 Realtek/其他 WiFi 驱动；
	# 关掉可避开从 EvilOlaf/rtl8189ES_linux 等仓库 fetch（VM 出网被 DNS 污染，TLS 握手会随机失败）
	declare -g EXTRAWIFI=no
	declare -g KERNEL_DRIVERS_SKIP+=(driver_rtl8189ES)
	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}
}
