# Rockchip RK3588 octa core 2-32GB SoC 2xGbE USB3 PCIe HDMI CAN
# HZ-EVM-RK3588 (合众恒跃) - Armbian board config
BOARD_NAME="HZ-EVM-RK3588"
BOARD_VENDOR="hezuo"
BOARDFAMILY="rockchip-rk3588"
BOARD_MAINTAINER="orca"
INTRODUCED="2026"
BOOTCONFIG="hz-evm-rk3588_defconfig"
KERNEL_TARGET="current,vendor"
KERNEL_TEST_TARGET="current,vendor"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3588-hz-evm-rk3588.dtb"
# binman: DDR/BL31 来自 rkbin blob，产物是 u-boot-rockchip.bin（mainline 标准做法，
# 与 rock-5b 一致）。不要用 spl-blobs —— 那要求手工 mkimage 生成 idbloader.img，
# 与 binman 镜像的部署方式（dd seek=1 bs=32k）不匹配。
BOOT_SCENARIO="binman"
BOOTFS_TYPE=fat
BOOTSIZE=256
IMAGE_PARTITION_TABLE="gpt"
PACKAGE_LIST_BOARD="i2c-tools can-utils"

# ==================== MIPI DSI (Tianma TL060FVXS07) ====================
# 参考案例里那套 "simple-panel-dsi" 是 Rockchip BSP 专有的，主线没有对应驱动，
# 所以这项工作由 patch/kernel/rk35xx-current/0002-drm-panel-add-tianma-*.patch
# 提供的新驱动承担。下面三个开关在
# linux-rockchip-rk3588-{current,edge}.config 里**默认都没开**，必须补上，
# 否则 &dsi0 / &mipidcphy0 使能了也 probe 不到任何东西。
#
# 注意 hook 里必须判断 .config 是否存在：custom_kernel_config 这个钩子会被调用多次，
# 其中一次并没有 .config 在场。
function custom_kernel_config__enable_mipi_dsi_display() {
	[[ -f .config ]] || return 0

	# RK3588 用的是第二代 Synopsys DSI host；老的 ROCKCHIP_DW_MIPI_DSI
	# （rk3288/rk3399 用）跟它毫无关系，别搞混。此项是 bool，只能 =y。
	kernel_config_set_y CONFIG_ROCKCHIP_DW_MIPI_DSI2

	# dsi0 的 PHY（rockchip,rk3588-mipi-dcphy）。设为 y 以免 RM_TIME 顺序问题。
	kernel_config_set_y CONFIG_PHY_ROCKCHIP_SAMSUNG_DCPHY

	# 0002-*.patch 新增的天马屏驱动。编进内核而不是模块：DSI 子设备的
	# 模块自动加载（of: modalias）不好赌，编进去最稳。
	kernel_config_set_y CONFIG_DRM_PANEL_TIANMA_TL060FVXS07
	# LCD_RESX(GPIO0_B2) 到底是"使能"还是"复位"还没定论，默认按高有效使能。
	# 要切语义**不用重编**：在 armbianEnv.txt 的 extraargs 里加
	#   panel-tianma-tl060fvxs07.gpio_is_reset=1
	# （编进内核的模块参数走 cmdline，就是这个写法）
}

# ==================== uboot config ====================
# current/edge: mainline U-Boot v2026.07 + rkbin BL31/DDR blobs
# vendor: Radxa vendor U-Boot + BSP kernel (family default)
function post_family_config__hz_evm_use_mainline_uboot_except_vendor() {
	if [[ "${BRANCH}" == "vendor" ]]; then
		display_alert "$BOARD" "Vendor: using vendor U-Boot + kernel" "info"
		return 0
	fi

	display_alert "$BOARD" "Mainline (${BRANCH}): using mainline U-Boot v2026.07" "info"
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot"
	declare -g BOOTBRANCH="tag:v2026.07"
	declare -g BOOTPATCHDIR="v2026.07"
	declare -g BOOTDIR="u-boot-${BOARD}"
	# 主线内核(torvalds)不带我们的板级 dts，必须自建 patch 目录注入。
	# 该目录随本 overlay 提供 patch/kernel/rk35xx-current/，其中
	# 0000.patching_config.yaml 的 dts-directories 负责把 dt/*.dts 拷到
	# arch/arm64/boot/dts/rockchip/ 并自动改写 Makefile。
	declare -g KERNELPATCHDIR="rk35xx-current"
	# 本板走双千兆网口，不需要附加 Realtek/其他 WiFi 驱动；
	# 关掉可避开从 EvilOlaf/rtl8189ES_linux 等仓库 fetch（VM 出网被 DNS 污染，TLS 握手会随机失败）
	declare -g EXTRAWIFI=no
	declare -g KERNEL_DRIVERS_SKIP+=(driver_rtl8189ES)
	# 主线 U-Boot 用 binman 产出 u-boot-rockchip.bin（rock-5b 同款方案）。
	# BOOT_SCENARIO=binman 时 prepare_boot_configuration() 会生成：
	#   UBOOT_TARGET_MAP="BL31=$RKBIN_DIR/$BL31_BLOB ROCKCHIP_TPL=$RKBIN_DIR/$DDR_BLOB;;u-boot-rockchip.bin"
	# 即：DDR/BL31 用 rkbin 的 blob（不编译 ATF），产出物是 binman 镜像。
	# BOOT_SCENARIO 已在文件顶部设为 binman。
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}
}
